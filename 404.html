<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page has moved</title>
  <meta name="robots" content="noindex,follow">
</head>
<body>
  <noscript>
    <ul><li>Go to the <a href="https://battlefleet-game.org"><em>Battlefleet Gothic: Remastered</em> Online Rulebook</a>.</li>
  </noscript>
  <script>
    const url = new URL(
      document.location.pathname + (document.location.search ?? "") + (document.location.hash ?? ""),
      "https://battlefleet-game.org/"
    );

    url.pathname = url.pathname.replace(/^\/bfg/, "");

    window.location = url;
  </script>
</body>
</html>
